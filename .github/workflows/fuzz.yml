name: Protocol fuzzing

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: middleware
            target: FuzzProxyTrust
          - package: middleware
            target: FuzzTraceparent
          - package: middleware
            target: FuzzGzipNegotiation
          - package: middleware
            target: FuzzLocaleNegotiation
          - package: middleware
            target: FuzzActionID
          - package: session
            target: FuzzSessionCookie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Fuzz protocol boundary
        run: go test ./${{ matrix.package }} -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=30s -parallel=2 -timeout=2m
      - name: Preserve reproducer
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz/
          if-no-files-found: ignore
