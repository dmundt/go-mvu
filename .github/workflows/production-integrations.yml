name: Production integrations

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        module: [adapters/caskstore, examples/production]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/production/go.mod
          cache-dependency-path: |
            go.sum
            adapters/caskstore/go.sum
            examples/production/go.sum
      - run: go test ./...
      - run: go vet ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
